<!DOCTYPE html><meta charset=UTF-8><meta name=viewport content="width=device-width"><style>*{box-sizing:border-box}body{font:14px system-ui;max-width:400px;margin:0 auto;padding:8px}textarea{width:100%;height:60px;font:12px monospace}button{margin:4px 4px 4px 0;padding:8px 12px}#o{white-space:pre-wrap;background:#f5f5f5;padding:8px;min-height:40px;margin:8px 0}</style><b>Paste data:</b><textarea id=i></textarea><button id=d>Decode</button><button id=c>Copy</button><div id=o></div><script>
function b(s){var t=s.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';var b=atob(t),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
async function dec(v){var h=v.indexOf('#');if(h>-1)v=v.slice(h+1);try{v=decodeURIComponent(v)}catch(e){}var d=new DecompressionStream('deflate-raw'),w=d.writable.getWriter();w.write(b(v.trim()));w.close();return new TextDecoder().decode(await new Response(d.readable).arrayBuffer())}
var $=function(x){return document.getElementById(x)};
$('d').onclick=async function(){try{$('o').textContent=await dec($('i').value)}catch(e){$('o').textContent='Error: '+e}};
$('c').onclick=function(){navigator.clipboard.writeText($('o').textContent)};
if(location.hash){$('i').value=location.hash.slice(1);dec(location.hash).then(function(t){$('o').textContent=t}).catch(function(e){$('o').textContent='Error: '+e})}
</script>
